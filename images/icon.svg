<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="azureGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="gitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F05133"/>
      <stop offset="1" stop-color="#BD2C00"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect x="0" y="0" width="128" height="128" rx="24"/>
    </clipPath>
    <clipPath id="leftHalf">
      <rect x="0" y="0" width="64" height="128"/>
    </clipPath>
    <clipPath id="rightHalf">
      <rect x="64" y="0" width="64" height="128"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <!-- Left half: Azure -->
    <rect x="0" y="0" width="64" height="128" fill="url(#azureGrad)"/>
    <!-- Right half: Git -->
    <rect x="64" y="0" width="64" height="128" fill="url(#gitGrad)"/>

    <!-- Subtle dividing seam -->
    <rect x="63.25" y="0" width="1.5" height="128" fill="#FFFFFF" opacity="0.35"/>

    <!-- Azure "A" / chevron glyph (white) -->
    <g clip-path="url(#leftHalf)" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 14 100 L 32 30 L 50 100"/>
      <path d="M 21 76 L 43 76"/>
    </g>

    <!-- Git branch graph (white) -->
    <g clip-path="url(#rightHalf)" stroke="#FFFFFF" stroke-linecap="round" fill="#FFFFFF">
      <circle cx="78" cy="42" r="7" stroke="none"/>
      <circle cx="78" cy="90" r="7" stroke="none"/>
      <circle cx="108" cy="66" r="7" stroke="none"/>
      <path d="M 78 49 L 78 83" stroke-width="5" fill="none"/>
      <path d="M 78 66 C 78 76 86 74 94 70 C 100 67 104 67 107 66" stroke-width="5" fill="none"/>
    </g>
  </g>
</svg>